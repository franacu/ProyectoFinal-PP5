[project]
name = "crce"
version = "0.1.0"
description = "Centro Regional de Coordinación de Emergencias — TP Integrador Paradigmas V"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.118.0",
    "pymongo>=4.18.3",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "mongomock>=4.3.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
