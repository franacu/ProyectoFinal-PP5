name: crce

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MONGO_HOST: db
      MONGO_USER: root
      MONGO_PASSWORD: example
      MONGO_PORT: "27017"
      MONGO_DB: crce
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: crce
      KEYCLOAK_CLIENT_ID: crce-api
      KEYCLOAK_URL_PUBLICA: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started

  db:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "root", "--password", "example",
             "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm"]
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/crce-realm.json:/opt/keycloak/data/import/crce-realm.json:ro

volumes:
  mongo-data:
