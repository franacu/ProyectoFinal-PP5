<script>
const D={"Aviso": {"archivo": "dominio/aviso.py", "simbolo": "Aviso", "linea": 156, "fin": 302, "doc": "", "codigo": "class Aviso:\n    def __init__(\n        self,\n        reportante_id: str,\n        ubicacion: Ubicacion,\n        tipo: TipoSituacion,\n        gravedad_estimada: Gravedad,\n        descripcion: str,\n        registrado_en: datetime,\n        aviso_id: str | None = None,\n    ) -> None:\n        _validar_datos(reportante_id, ubicacion, tipo, gravedad_estimada, descripcion, registrado_en)\n        self._id = aviso_id or str(uuid.uuid4())\n        self._reportante_id = reportante_id\n        self._ubicacion = ubicacion\n        self._tipo = tipo\n        self._gravedad_estimada = gravedad_estimada\n        self._descripcion = descripcion.strip()\n        self._registrado_en = registrado_en\n        self._estado: _Estado = _PENDIENTE  # R1: todo aviso nace pendiente\n        self._notas: list[Nota] = []\n        self._descarte: Descarte | None = None\n        self._registros: list[Registro] = [\n            Registro.de(reportante_id, registrado_en, Operacion.AVISO_REGISTRADO, self._id,\n                        tipo=tipo.value, gravedad=gravedad_estimada.name.lower())\n        ]\n\n    @classmethod\n    def restaurar(\n        cls,\n        *,\n        aviso_id: str,\n        reportante_id: str,\n        ubicacion: Ubicacion,\n        tipo: TipoSituacion,\n        gravedad_estimada: Gravedad,\n        descripcion: str,\n        registrado_en: datetime,\n        estado: EstadoAviso,\n        notas: tuple[Nota, ...] = (),\n        descarte: Descarte | None = None,\n        registros: tuple[Registro, ...] = (),\n    ) -> Aviso:\n        \"\"\"Reconstruye un aviso ya existente (lo usar\u00e1 el repositorio Mongo).\n\n        Tambi\u00e9n permite armar un aviso ACEPTADO sin implementar todav\u00eda\n        la operaci\u00f3n aceptar (escenario 9 del avance).\n        \"\"\"\n        if estado not in _ESTADO_POR_ETIQUETA:\n            raise DatoDeAvisoInvalido(f\"Estado desconocido: {estado!r}\")\n        nuevo_estado = _ESTADO_POR_ETIQUETA[estado]\n        nuevo_estado.validar_descarte(descarte)\n        aviso = cls(reportante_id, ubicacion, tipo, gravedad_estimada, descripcion, registrado_en, aviso_id)\n        aviso._estado = nuevo_estado\n        aviso._notas = list(notas)\n        aviso._descarte = descarte\n        if registros:\n            aviso._registros = list(registros)\n        return aviso\n\n    # \u2500\u2500 Comportamiento \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n    def agregar_nota(self, autor_id: str, texto: str, fecha_hora: datetime) -> Nota:\n        \"\"\"R2, R3, R5, R6 y \u00a72.1 (solo el reportante).\"\"\"\n        self._estado.permitir_nota()\n        if autor_id != self._reportante_id:\n            raise NotaDeOtroAutor(\"Solo el reportante del aviso puede agregarle notas\")\n        nota = Nota(autor_id, texto, fecha_hora)  # valida antes de tocar la lista\n        registro = Registro.de(autor_id, fecha_hora, Operacion.NOTA_AGREGADA, self._id)\n        self._notas.append(nota)\n        self._registros.append(registro)\n        return nota\n\n    def descartar(self, operador_id: str, justificacion: str, fecha_hora: datetime) -> None:\n        \"\"\"R4, R5, R6.\"\"\"\n        siguiente = self._estado.descartar()  # lanza si ya no est\u00e1 pendiente\n        descarte = Descarte(operador_id, justificacion, fecha_hora)\n        registro = Registro.de(operador_id, fecha_hora, Operacion.AVISO_DESCARTADO, self._id,\n                               justificacion=descarte.justificacion)\n        # reci\u00e9n ac\u00e1 cambia el objeto: todo lo que pod\u00eda fallar ya pas\u00f3\n        self._descarte = descarte\n        self._estado = siguiente\n        self._registros.append(registro)\n\n    def aceptar(self, operador_id: str, tipo: TipoSituacion, gravedad: Gravedad,\n                fecha_hora: datetime) -> Emergencia:\n        \"\"\"\u00a72.2, \u00a77.1: acepta el aviso, confirma o corrige tipo y gravedad y origina UNA emergencia.\n\n        Los datos originales del aviso no se pisan: la emergencia guarda los confirmados.\n        \"\"\"\n        siguiente = self._estado.aceptar()  # lanza si ya no est\u00e1 pendiente\n        emergencia = Emergencia(self._id, self._reportante_id, self._ubicacion, tipo, gravedad,\n                                fecha_hora, operador_id)  # valida todo antes de que cambie el aviso\n        registro = Registro.de(operador_id, fecha_hora, Operacion.AVISO_ACEPTADO, self._id, emergencia.id,\n                               tipo=tipo.value, gravedad=gravedad.name.lower())\n        self._estado = siguiente\n        self._registros.append(registro)\n        return emergencia\n\n    # \u2500\u2500 Lectura (sin setters: nadie cambia el aviso desde afuera) \u2500\n\n    @property\n    def id(self) -> str:\n        return self._id\n\n    @property\n    def reportante_id(self) -> str:\n        return self._reportante_id\n\n    @property\n    def ubicacion(self) -> Ubicacion:\n        return self._ubicacion\n\n    @property\n    def tipo(self) -> TipoSituacion:\n        return self._tipo\n\n    @property\n    def gravedad_estimada(self) -> Gravedad:\n        return self._gravedad_estimada\n\n    @property\n    def descripcion(self) -> str:\n        return self._descripcion\n\n    @property\n    def registrado_en(self) -> datetime:\n        return self._registrado_en\n\n    @property\n    def estado(self) -> EstadoAviso:\n        \"\"\"Solo el nombre del estado: el objeto estado no sale del aviso.\"\"\"\n        return self._estado.etiqueta\n\n    @property\n    def notas(self) -> tuple[Nota, ...]:\n        \"\"\"Tupla: aviso.notas.append(...) no existe, R2 no se puede saltear.\"\"\"\n        return tuple(self._notas)\n\n    @property\n    def descarte(self) -> Descarte | None:\n        return self._descarte\n\n    @property\n    def registros(self) -> tuple[Registro, ...]:\n        \"\"\"Historial inmutable del aviso (\u00a79).\"\"\"\n        return tuple(self._registros)", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/aviso.py"}, "Emergencia": {"archivo": "dominio/emergencia.py", "simbolo": "Emergencia", "linea": 78, "fin": 243, "doc": "", "codigo": "class Emergencia:\n    def __init__(\n        self,\n        aviso_id: str,\n        reportante_id: str,\n        ubicacion: Ubicacion,\n        tipo: TipoSituacion,\n        gravedad: Gravedad,\n        creada_en: datetime,\n        operador_id: str,\n        emergencia_id: str | None = None,\n    ) -> None:\n        if not hay_texto(aviso_id) or not hay_texto(reportante_id) or ubicacion is None:\n            raise AceptacionInvalida(\"La emergencia necesita aviso de origen, reportante y ubicaci\u00f3n\")\n        if not TipoSituacion.contiene(tipo) or not Gravedad.contiene(gravedad):\n            raise AceptacionInvalida(\"Tipo de situaci\u00f3n o gravedad fuera de cat\u00e1logo\")\n        if not hay_texto(operador_id) or creada_en is None:\n            raise AceptacionInvalida(\"La emergencia necesita operador y fecha de aceptaci\u00f3n\")\n        self._id = emergencia_id or str(uuid.uuid4())\n        self._aviso_id = aviso_id\n        self._reportante_id = reportante_id\n        self._ubicacion = ubicacion\n        self._tipo = tipo\n        self._gravedad = gravedad\n        self._creada_en = creada_en\n        self._estado: _Estado = _ABIERTA\n        self._misiones: dict[str, Mision] = {}\n        self._registros: list[Registro] = [\n            Registro.de(operador_id, creada_en, Operacion.EMERGENCIA_CREADA, self._id, aviso_id,\n                        tipo=tipo.value, gravedad=gravedad.name.lower())\n        ]\n\n    # \u2500\u2500 Misiones: operador (\u00a72.2) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n    def crear_mision(self, mision: Mision, operador_id: str, fecha_hora: datetime) -> None:\n        self._estado.permitir_modificaciones()\n        mision.verificar_situacion(self._tipo)               # \u00a76.4\n        registro = Registro.de(operador_id, fecha_hora, Operacion.MISION_CREADA, self._id, mision.id,\n                               tipo=mision.tipo.value)\n        self._misiones[mision.id] = mision\n        self._registros.append(registro)\n\n    def asignar_mision(self, mision_id: str, unidad: Unidad, operador_id: str, fecha_hora: datetime) -> None:\n        self._estado.permitir_modificaciones()                # 1. emergencia abierta\n        mision = self._mision(mision_id)\n        registro = Registro.de(operador_id, fecha_hora, Operacion.MISION_ASIGNADA, self._id, mision_id,\n                               unidad.id)\n        mision.asignar(unidad)                               # 2\u20137. estado, unidad, veh\u00edculo, personal, equipo\n        self._registros.append(registro)\n\n    def reasignar_mision(self, mision_id: str, unidad_nueva: Unidad, operador_id: str,\n                         fecha_hora: datetime) -> None:\n        self._estado.permitir_modificaciones()\n        mision = self._mision(mision_id)\n        anterior = mision.unidad_id\n        mision.reasignar(unidad_nueva)\n        self._registros.append(Registro.de(\n            operador_id, fecha_hora, Operacion.MISION_REASIGNADA, self._id, mision_id,\n            unidad_anterior=str(anterior), unidad_nueva=unidad_nueva.id))\n\n    def cancelar_mision(self, mision_id: str, operador_id: str, fecha_hora: datetime) -> None:\n        self._estado.permitir_modificaciones()\n        mision = self._mision(mision_id)\n        unidad = mision.unidad_id\n        registro = Registro.de(operador_id, fecha_hora, Operacion.MISION_CANCELADA, self._id, mision_id,\n                               unidad_liberada=str(unidad))\n        mision.cancelar()\n        self._registros.append(registro)\n\n    # \u2500\u2500 Misiones: jefe de unidad (\u00a72.3) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n    def rechazar_mision(self, mision_id: str, jefe_id: str, justificacion: str, fecha_hora: datetime) -> None:\n        self._estado.permitir_modificaciones()\n        mision = self._mision(mision_id)\n        unidad = mision.unidad_id\n        registro = Registro.de(jefe_id, fecha_hora, Operacion.MISION_RECHAZADA, self._id, mision_id,\n                               str(unidad), justificacion=justificacion)\n        mision.rechazar(jefe_id, justificacion)\n        self._registros.append(registro)\n\n    def iniciar_mision(self, mision_id: str, jefe_id: str, fecha_hora: datetime) -> None:\n        self._estado.permitir_modificaciones()\n        mision = self._mision(mision_id)\n        registro = Registro.de(jefe_id, fecha_hora, Operacion.MISION_INICIADA, self._id, mision_id,\n                               str(mision.unidad_id))\n        mision.iniciar(jefe_id)\n        self._registros.append(registro)\n\n    def registrar_novedad(self, mision_id: str, jefe_id: str, texto: str, fecha_hora: datetime) -> None:\n        self._estado.permitir_modificaciones()\n        mision = self._mision(mision_id)\n        mision.registrar_novedad(jefe_id, texto, fecha_hora)\n        self._registros.append(Registro.de(jefe_id, fecha_hora, Operacion.MISION_NOVEDAD, self._id,\n                                           mision_id, novedad=texto))\n\n    def finalizar_mision(self, mision_id: str, jefe_id: str, resultado: ResultadoMision, tareas: str,\n                         fecha_hora: datetime) -> None:\n        self._estado.permitir_modificaciones()\n        mision = self._mision(mision_id)\n        unidad = mision.unidad_id\n        mision.finalizar(jefe_id, resultado, tareas, fecha_hora)\n        self._registros.append(Registro.de(jefe_id, fecha_hora, Operacion.MISION_FINALIZADA, self._id,\n                                           mision_id, str(unidad), resultado=resultado.value,\n                                           tareas=tareas))\n\n    # \u2500\u2500 Cierre: supervisor (\u00a77.2) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n    def cerrar(self, supervisor_id: str, fecha_hora: datetime) -> None:\n        siguiente = self._estado.cerrar(self._misiones.values())\n        registro = Registro.de(supervisor_id, fecha_hora, Operacion.EMERGENCIA_CERRADA, self._id)\n        self._estado = siguiente\n        self._registros.append(registro)\n\n    # \u2500\u2500 Lectura \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n    @property\n    def id(self) -> str:\n        return self._id\n\n    @property\n    def aviso_id(self) -> str:\n        return self._aviso_id\n\n    @property\n    def reportante_id(self) -> str:\n        return self._reportante_id\n\n    @property\n    def ubicacion(self) -> Ubicacion:\n        return self._ubicacion\n\n    @property\n    def tipo(self) -> TipoSituacion:\n        return self._tipo\n\n    @property\n    def gravedad(self) -> Gravedad:\n        \"\"\"Gravedad CONFIRMADA por el operador al aceptar el aviso.\"\"\"\n        return self._gravedad\n\n    @property\n    def creada_en(self) -> datetime:\n        \"\"\"Momento de aceptaci\u00f3n del aviso (desempata la prioridad, \u00a74).\"\"\"\n        return self._creada_en\n\n    @property\n    def estado(self) -> EstadoEmergencia:\n        return self._estado.etiqueta\n\n    @property\n    def misiones(self) -> tuple[VistaMision, ...]:\n        return tuple(m.vista() for m in self._misiones.values())\n\n    @property\n    def registros(self) -> tuple[Registro, ...]:\n        return tuple(self._registros)\n\n    @property\n    def clave_de_prioridad(self) -> tuple[int, datetime]:\n        \"\"\"Menor clave = m\u00e1s urgente: gravedad Alta primero y, a igual gravedad, la m\u00e1s antigua.\"\"\"\n        return (-self._gravedad.value, self._creada_en)\n\n    def _mision(self, mision_id: str) -> Mision:\n        if mision_id not in self._misiones:\n            raise NoEncontrado(f\"La emergencia no tiene la misi\u00f3n {mision_id}\")\n        return self._misiones[mision_id]", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/emergencia.py"}, "Equipo": {"archivo": "dominio/equipamiento.py", "simbolo": "Equipo", "linea": 12, "fin": 31, "doc": "", "codigo": "@dataclass(frozen=True, slots=True)\nclass Equipo:\n    id: str\n    categoria: CategoriaEquipo\n    condicion: CondicionOperativa = CondicionOperativa.OPERATIVO\n\n    def __post_init__(self) -> None:\n        if not hay_texto(self.id):\n            raise RecursoInvalido(\"El equipo necesita identificaci\u00f3n\")\n        if not CategoriaEquipo.contiene(self.categoria):\n            raise RecursoInvalido(\"Categor\u00eda de equipo fuera de cat\u00e1logo\")\n        if not CondicionOperativa.contiene(self.condicion):\n            raise RecursoInvalido(\"Condici\u00f3n de equipo fuera de cat\u00e1logo\")\n\n    @property\n    def operativo(self) -> bool:\n        return self.condicion is CondicionOperativa.OPERATIVO\n\n    def con_condicion(self, condicion: CondicionOperativa) -> Equipo:\n        return replace(self, condicion=condicion)", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/equipamiento.py"}, "Flota": {"archivo": "dominio/flota.py", "simbolo": "Flota", "linea": 32, "fin": 107, "doc": "", "codigo": "class Flota:\n    def __init__(self) -> None:\n        self._bases: dict[str, BaseOperativa] = {}\n        self._unidades: dict[str, Unidad] = {}\n\n    # \u2500\u2500 Consulta \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n    @property\n    def bases(self) -> tuple[BaseOperativa, ...]:\n        return tuple(self._bases.values())\n\n    @property\n    def unidades(self) -> tuple[Unidad, ...]:\n        return tuple(self._unidades.values())\n\n    def unidad(self, unidad_id: str) -> Unidad:\n        if unidad_id not in self._unidades:\n            raise NoEncontrado(f\"No existe la unidad {unidad_id}\")\n        return self._unidades[unidad_id]\n\n    def unidades_de(self, base_id: str) -> tuple[Unidad, ...]:\n        return tuple(u for u in self._unidades.values() if u.base_id == base_id)\n\n    # \u2500\u2500 Altas \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n    def registrar_base(self, base: BaseOperativa) -> None:\n        if base.id in self._bases:\n            raise RecursoDuplicado(f\"Ya existe la base {base.id}\")\n        self._bases[base.id] = base\n\n    def incorporar_unidad(self, unidad: Unidad, actor_id: str, fecha_hora: datetime) -> None:\n        if unidad.base_id not in self._bases:\n            raise NoEncontrado(f\"No existe la base {unidad.base_id}\")\n        if unidad.id in self._unidades:\n            raise RecursoDuplicado(f\"Ya existe la unidad {unidad.id}\")\n        for persona in unidad.personal:\n            self._exigir_persona_libre(persona.id, None)\n        self._exigir_vehiculo_libre(unidad.vehiculo.id, None)\n        for equipo in unidad.equipamiento:\n            self._exigir_equipo_libre(equipo.id, None)\n        unidad.registrar_alta(actor_id, fecha_hora)  # si falla, la flota no cambi\u00f3\n        self._unidades[unidad.id] = unidad\n\n    # \u2500\u2500 Cambios que necesitan mirar a las dem\u00e1s unidades \u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n    def incorporar_personal(self, unidad_id: str, persona: Persona, actor_id: str, fecha_hora: datetime) -> None:\n        unidad = self.unidad(unidad_id)\n        self._exigir_persona_libre(persona.id, unidad_id)\n        unidad.incorporar_personal(persona, actor_id, fecha_hora)\n\n    def cambiar_vehiculo(self, unidad_id: str, vehiculo: Vehiculo, actor_id: str, fecha_hora: datetime) -> None:\n        unidad = self.unidad(unidad_id)\n        self._exigir_vehiculo_libre(vehiculo.id, unidad_id)\n        unidad.cambiar_vehiculo(vehiculo, actor_id, fecha_hora)\n\n    def incorporar_equipo(self, unidad_id: str, equipo: Equipo, actor_id: str, fecha_hora: datetime) -> None:\n        unidad = self.unidad(unidad_id)\n        self._exigir_equipo_libre(equipo.id, unidad_id)\n        unidad.incorporar_equipo(equipo, actor_id, fecha_hora)\n\n    # \u2500\u2500 Unicidad entre unidades (\u00a75.2) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n    def _exigir_persona_libre(self, persona_id: str, salvo_unidad_id: str | None) -> None:\n        for u in self._unidades.values():\n            if u.id != salvo_unidad_id and u.tiene_persona(persona_id):\n                raise RecursoDuplicado(f\"{persona_id} ya integra la unidad {u.id}\")\n\n    def _exigir_vehiculo_libre(self, vehiculo_id: str, salvo_unidad_id: str | None) -> None:\n        for u in self._unidades.values():\n            if u.id != salvo_unidad_id and u.usa_vehiculo(vehiculo_id):\n                raise RecursoDuplicado(f\"El veh\u00edculo {vehiculo_id} ya est\u00e1 en la unidad {u.id}\")\n\n    def _exigir_equipo_libre(self, equipo_id: str, salvo_unidad_id: str | None) -> None:\n        for u in self._unidades.values():\n            if u.id != salvo_unidad_id and u.tiene_equipo(equipo_id):\n                raise RecursoDuplicado(f\"El equipo {equipo_id} ya est\u00e1 en la unidad {u.id}\")", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/flota.py"}, "Registro": {"archivo": "dominio/historial.py", "simbolo": "Registro", "linea": 49, "fin": 76, "doc": "", "codigo": "@dataclass(frozen=True, slots=True)\nclass Registro:\n    actor_id: str\n    fecha_hora: datetime\n    operacion: Operacion\n    recursos: tuple[str, ...]\n    detalle: tuple[tuple[str, str], ...] = ()\n\n    def __post_init__(self) -> None:\n        if not hay_texto(self.actor_id):\n            raise RegistroInvalido(\"El registro necesita un actor\")\n        if self.fecha_hora is None:\n            raise RegistroInvalido(\"El registro necesita fecha y hora\")\n        if self.operacion not in tuple(Operacion):\n            raise RegistroInvalido(f\"Operaci\u00f3n desconocida: {self.operacion!r}\")\n        if not self.recursos:\n            raise RegistroInvalido(\"El registro necesita los recursos afectados\")\n\n    @classmethod\n    def de(cls, actor_id: str, fecha_hora: datetime, operacion: Operacion,\n           *recursos: str, **detalle: str) -> Registro:\n        \"\"\"Atajo: los datos del detalle se guardan como pares (clave, texto).\"\"\"\n        return cls(actor_id, fecha_hora, operacion, tuple(recursos),\n                   tuple((clave, str(valor)) for clave, valor in detalle.items()))\n\n    def dato(self, clave: str) -> str | None:\n        \"\"\"Valor del detalle para una clave (p. ej. 'unidad_anterior').\"\"\"\n        return dict(self.detalle).get(clave)", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/historial.py"}, "AsistenciaSanitaria": {"archivo": "dominio/mision.py", "simbolo": "AsistenciaSanitaria", "linea": 393, "fin": 404, "doc": "\u00a76.3: ambulancia, conductor, un integrante con primeros auxilios y un equipo sanitario.", "codigo": "class AsistenciaSanitaria(Mision):\n    \"\"\"\u00a76.3: ambulancia, conductor, un integrante con primeros auxilios y un equipo sanitario.\"\"\"\n\n    tipo = TipoMision.ASISTENCIA_SANITARIA\n    situaciones_admitidas = frozenset(TipoSituacion)\n    puestos = (Competencia.CONDUCCION, Competencia.PRIMEROS_AUXILIOS)\n\n    def verificar_vehiculo(self, vehiculo: Vehiculo) -> None:\n        vehiculo.verificar_asistencia()\n\n    def verificar_equipamiento(self, unidad: Unidad) -> None:\n        self._exigir_equipo(unidad, CategoriaEquipo.EQUIPO_SANITARIO)", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/mision.py"}, "Evacuacion": {"archivo": "dominio/mision.py", "simbolo": "Evacuacion", "linea": 355, "fin": 376, "doc": "\u00a76.1: traslada una cantidad de personas. Sin equipamiento especializado.", "codigo": "class Evacuacion(Mision):\n    \"\"\"\u00a76.1: traslada una cantidad de personas. Sin equipamiento especializado.\"\"\"\n\n    tipo = TipoMision.EVACUACION\n    situaciones_admitidas = frozenset({TipoSituacion.INUNDACION, TipoSituacion.INCENDIO})\n    puestos = (Competencia.CONDUCCION, Competencia.EVACUACION)\n\n    def __init__(self, objetivo: str, cantidad_personas: int, mision_id: str | None = None) -> None:\n        if not es_entero_positivo(cantidad_personas):\n            raise MisionInvalida(\"La cantidad de personas a evacuar debe ser un entero positivo\")\n        super().__init__(objetivo, mision_id)\n        self._cantidad = cantidad_personas\n\n    @property\n    def cantidad_personas(self) -> int:\n        return self._cantidad\n\n    def verificar_vehiculo(self, vehiculo: Vehiculo) -> None:\n        vehiculo.verificar_evacuacion(self._cantidad)\n\n    def verificar_equipamiento(self, unidad: Unidad) -> None:\n        pass  # las evacuaciones no requieren equipamiento especializado (\u00a75.5)", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/mision.py"}, "Mision": {"archivo": "dominio/mision.py", "simbolo": "Mision", "linea": 236, "fin": 350, "doc": "", "codigo": "class Mision(ABC):\n    tipo: TipoMision\n    situaciones_admitidas: frozenset[TipoSituacion]  # \u00a76.4\n    puestos: tuple[Competencia, ...]                # \u00a76.1\u20136.3: un puesto = una persona distinta\n\n    def __init__(self, objetivo: str, mision_id: str | None = None) -> None:\n        if not hay_texto(objetivo):\n            raise MisionInvalida(\"La misi\u00f3n necesita un objetivo\")\n        self._id = mision_id or str(uuid.uuid4())\n        self._objetivo = objetivo.strip()\n        self._estado: _Estado = _PENDIENTE\n        self._asignacion: _Asignacion = _SIN_UNIDAD\n        self._novedades: list[Novedad] = []\n        self._resultado: Resultado | None = None\n\n    # \u2500\u2500 Lo que cada tipo de misi\u00f3n define \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n    @abstractmethod\n    def verificar_vehiculo(self, vehiculo: Vehiculo) -> None:\n        \"\"\"Doble despacho: el veh\u00edculo decide si sirve (o lanza VehiculoIncompatible).\"\"\"\n\n    @abstractmethod\n    def verificar_equipamiento(self, unidad: Unidad) -> None:\n        \"\"\"Lanza EquipamientoInsuficiente si falta un elemento operativo requerido.\"\"\"\n\n    def verificar_personal(self, personal: Sequence[Persona]) -> None:\n        if not existe_distribucion(self.puestos, tuple(personal)):\n            raise PersonalInsuficiente(\n                f\"No hay personas distintas que cubran: {', '.join(c.value for c in self.puestos)}\")\n\n    def verificar_situacion(self, situacion: TipoSituacion) -> None:\n        if situacion not in self.situaciones_admitidas:\n            raise MisionIncompatible(\n                f\"Una misi\u00f3n de {self.tipo.value} no est\u00e1 contemplada para {situacion.value}\")\n\n    def _exigir_equipo(self, unidad: Unidad, categoria: CategoriaEquipo) -> None:\n        if not unidad.tiene_equipo_operativo(categoria):\n            raise EquipamientoInsuficiente(f\"Falta un {categoria.value} operativo\")\n\n    # \u2500\u2500 Operaciones del operador (\u00a72.2) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n    def asignar(self, unidad: Unidad) -> None:\n        siguiente = self._estado.asignar()\n        unidad.comprometer(self)          # verifica todo; si falla no cambi\u00f3 nada\n        self._asignacion = _ConUnidad(unidad)\n        self._estado = siguiente\n\n    def reasignar(self, unidad_nueva: Unidad) -> None:\n        siguiente = self._estado.reasignar()\n        anterior = self._asignacion\n        unidad_nueva.comprometer(self)    # si falla, la anterior sigue asignada y reservada\n        anterior.liberar(self._id)\n        self._asignacion = _ConUnidad(unidad_nueva)\n        self._estado = siguiente\n\n    def cancelar(self) -> None:\n        siguiente = self._estado.cancelar()\n        self._asignacion.liberar(self._id)\n        self._asignacion = _SIN_UNIDAD\n        self._estado = siguiente\n\n    # \u2500\u2500 Operaciones del jefe de la unidad (\u00a72.3) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n    def rechazar(self, jefe_id: str, justificacion: str) -> None:\n        siguiente = self._estado.rechazar()\n        self._asignacion.exigir_jefe(jefe_id)\n        if not hay_texto(justificacion):\n            raise JustificacionVacia(\"Rechazar una misi\u00f3n exige una justificaci\u00f3n\")\n        self._asignacion.liberar(self._id)\n        self._asignacion = _SIN_UNIDAD\n        self._estado = siguiente\n\n    def iniciar(self, jefe_id: str) -> None:\n        siguiente = self._estado.iniciar()\n        self._asignacion.exigir_jefe(jefe_id)\n        self._estado = siguiente\n\n    def registrar_novedad(self, jefe_id: str, texto: str, fecha_hora: datetime) -> None:\n        self._estado.permitir_novedad()\n        self._asignacion.exigir_jefe(jefe_id)\n        self._novedades.append(Novedad(jefe_id, texto, fecha_hora))\n\n    def finalizar(self, jefe_id: str, resultado: ResultadoMision, tareas: str, fecha_hora: datetime) -> None:\n        siguiente = self._estado.finalizar()\n        self._asignacion.exigir_jefe(jefe_id)\n        nuevo = Resultado(resultado, tareas, fecha_hora)   # se valida antes de liberar la unidad\n        self._asignacion.liberar(self._id)\n        self._resultado = nuevo\n        self._estado = siguiente\n\n    # \u2500\u2500 Para la emergencia \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n    def verificar_concluida(self) -> None:\n        self._estado.verificar_concluida()\n\n    def es_exitosa(self) -> bool:\n        return self._estado.exito(self._resultado)\n\n    # \u2500\u2500 Lectura \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n    @property\n    def id(self) -> str:\n        return self._id\n\n    @property\n    def estado(self) -> EstadoMision:\n        return self._estado.etiqueta\n\n    @property\n    def unidad_id(self) -> str | None:\n        return self._asignacion.unidad_id\n\n    def vista(self) -> VistaMision:\n        return VistaMision(self._id, self.tipo, self._objetivo, self.estado, self.unidad_id,\n                           tuple(self._novedades), self._resultado)", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/mision.py"}, "Mision.asignar": {"archivo": "dominio/mision.py", "simbolo": "Mision.asignar", "linea": 277, "fin": 281, "doc": "", "codigo": "def asignar(self, unidad: Unidad) -> None:\n    siguiente = self._estado.asignar()\n    unidad.comprometer(self)          # verifica todo; si falla no cambi\u00f3 nada\n    self._asignacion = _ConUnidad(unidad)\n    self._estado = siguiente", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/mision.py"}, "Mision.cancelar": {"archivo": "dominio/mision.py", "simbolo": "Mision.cancelar", "linea": 291, "fin": 295, "doc": "", "codigo": "def cancelar(self) -> None:\n    siguiente = self._estado.cancelar()\n    self._asignacion.liberar(self._id)\n    self._asignacion = _SIN_UNIDAD\n    self._estado = siguiente", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/mision.py"}, "Mision.finalizar": {"archivo": "dominio/mision.py", "simbolo": "Mision.finalizar", "linea": 318, "fin": 324, "doc": "", "codigo": "def finalizar(self, jefe_id: str, resultado: ResultadoMision, tareas: str, fecha_hora: datetime) -> None:\n    siguiente = self._estado.finalizar()\n    self._asignacion.exigir_jefe(jefe_id)\n    nuevo = Resultado(resultado, tareas, fecha_hora)   # se valida antes de liberar la unidad\n    self._asignacion.liberar(self._id)\n    self._resultado = nuevo\n    self._estado = siguiente", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/mision.py"}, "Mision.iniciar": {"archivo": "dominio/mision.py", "simbolo": "Mision.iniciar", "linea": 308, "fin": 311, "doc": "", "codigo": "def iniciar(self, jefe_id: str) -> None:\n    siguiente = self._estado.iniciar()\n    self._asignacion.exigir_jefe(jefe_id)\n    self._estado = siguiente", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/mision.py"}, "Mision.reasignar": {"archivo": "dominio/mision.py", "simbolo": "Mision.reasignar", "linea": 283, "fin": 289, "doc": "", "codigo": "def reasignar(self, unidad_nueva: Unidad) -> None:\n    siguiente = self._estado.reasignar()\n    anterior = self._asignacion\n    unidad_nueva.comprometer(self)    # si falla, la anterior sigue asignada y reservada\n    anterior.liberar(self._id)\n    self._asignacion = _ConUnidad(unidad_nueva)\n    self._estado = siguiente", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/mision.py"}, "Mision.rechazar": {"archivo": "dominio/mision.py", "simbolo": "Mision.rechazar", "linea": 299, "fin": 306, "doc": "", "codigo": "def rechazar(self, jefe_id: str, justificacion: str) -> None:\n    siguiente = self._estado.rechazar()\n    self._asignacion.exigir_jefe(jefe_id)\n    if not hay_texto(justificacion):\n        raise JustificacionVacia(\"Rechazar una misi\u00f3n exige una justificaci\u00f3n\")\n    self._asignacion.liberar(self._id)\n    self._asignacion = _SIN_UNIDAD\n    self._estado = siguiente", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/mision.py"}, "Novedad": {"archivo": "dominio/mision.py", "simbolo": "Novedad", "linea": 47, "fin": 55, "doc": "", "codigo": "@dataclass(frozen=True, slots=True)\nclass Novedad:\n    jefe_id: str\n    texto: str\n    fecha_hora: datetime\n\n    def __post_init__(self) -> None:\n        if not hay_texto(self.texto) or not hay_texto(self.jefe_id) or self.fecha_hora is None:\n            raise MisionInvalida(\"La novedad necesita autor, texto y fecha\")", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/mision.py"}, "Rescate": {"archivo": "dominio/mision.py", "simbolo": "Rescate", "linea": 379, "fin": 390, "doc": "\u00a76.2: conductor + dos rescatistas distintos entre s\u00ed y un equipo de rescate operativo.", "codigo": "class Rescate(Mision):\n    \"\"\"\u00a76.2: conductor + dos rescatistas distintos entre s\u00ed y un equipo de rescate operativo.\"\"\"\n\n    tipo = TipoMision.RESCATE\n    situaciones_admitidas = frozenset(TipoSituacion)\n    puestos = (Competencia.CONDUCCION, Competencia.RESCATE, Competencia.RESCATE)\n\n    def verificar_vehiculo(self, vehiculo: Vehiculo) -> None:\n        vehiculo.verificar_rescate()\n\n    def verificar_equipamiento(self, unidad: Unidad) -> None:\n        self._exigir_equipo(unidad, CategoriaEquipo.EQUIPO_DE_RESCATE)", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/mision.py"}, "Resultado": {"archivo": "dominio/mision.py", "simbolo": "Resultado", "linea": 58, "fin": 76, "doc": "Lo que registra el jefe al finalizar (\u00a72.3): resultado y tareas realizadas.", "codigo": "@dataclass(frozen=True, slots=True)\nclass Resultado:\n    \"\"\"Lo que registra el jefe al finalizar (\u00a72.3): resultado y tareas realizadas.\"\"\"\n\n    resultado: ResultadoMision\n    tareas: str\n    fecha_hora: datetime\n\n    def __post_init__(self) -> None:\n        if not ResultadoMision.contiene(self.resultado):\n            raise ResultadoInvalido(\"Resultado fuera de cat\u00e1logo\")\n        if not hay_texto(self.tareas):\n            raise ResultadoInvalido(\"Finalizar exige describir las tareas realizadas\")\n        if self.fecha_hora is None:\n            raise ResultadoInvalido(\"El resultado necesita fecha y hora\")\n\n    @property\n    def satisfactorio(self) -> bool:\n        return self.resultado is ResultadoMision.SATISFACTORIO", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/mision.py"}, "_Asignada": {"archivo": "dominio/mision.py", "simbolo": "_Asignada", "linea": 150, "fin": 163, "doc": "", "codigo": "class _Asignada(_Estado):\n    etiqueta = EstadoMision.ASIGNADA\n\n    def reasignar(self) -> _Estado:\n        return _ASIGNADA\n\n    def rechazar(self) -> _Estado:\n        return _PENDIENTE\n\n    def iniciar(self) -> _Estado:\n        return _EN_EJECUCION\n\n    def cancelar(self) -> _Estado:\n        return _CANCELADA", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/mision.py"}, "_Asignada.cancelar": {"archivo": "dominio/mision.py", "simbolo": "_Asignada.cancelar", "linea": 162, "fin": 163, "doc": "", "codigo": "def cancelar(self) -> _Estado:\n    return _CANCELADA", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/mision.py"}, "_Asignada.iniciar": {"archivo": "dominio/mision.py", "simbolo": "_Asignada.iniciar", "linea": 159, "fin": 160, "doc": "", "codigo": "def iniciar(self) -> _Estado:\n    return _EN_EJECUCION", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/mision.py"}, "_Asignada.reasignar": {"archivo": "dominio/mision.py", "simbolo": "_Asignada.reasignar", "linea": 153, "fin": 154, "doc": "", "codigo": "def reasignar(self) -> _Estado:\n    return _ASIGNADA", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/mision.py"}, "_Asignada.rechazar": {"archivo": "dominio/mision.py", "simbolo": "_Asignada.rechazar", "linea": 156, "fin": 157, "doc": "", "codigo": "def rechazar(self) -> _Estado:\n    return _PENDIENTE", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/mision.py"}, "_Cancelada": {"archivo": "dominio/mision.py", "simbolo": "_Cancelada", "linea": 186, "fin": 190, "doc": "", "codigo": "class _Cancelada(_Estado):\n    etiqueta = EstadoMision.CANCELADA\n\n    def verificar_concluida(self) -> None:\n        pass", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/mision.py"}, "_EnEjecucion": {"archivo": "dominio/mision.py", "simbolo": "_EnEjecucion", "linea": 166, "fin": 173, "doc": "", "codigo": "class _EnEjecucion(_Estado):\n    etiqueta = EstadoMision.EN_EJECUCION\n\n    def permitir_novedad(self) -> None:\n        pass\n\n    def finalizar(self) -> _Estado:\n        return _FINALIZADA", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/mision.py"}, "_EnEjecucion.finalizar": {"archivo": "dominio/mision.py", "simbolo": "_EnEjecucion.finalizar", "linea": 172, "fin": 173, "doc": "", "codigo": "def finalizar(self) -> _Estado:\n    return _FINALIZADA", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/mision.py"}, "_Finalizada": {"archivo": "dominio/mision.py", "simbolo": "_Finalizada", "linea": 176, "fin": 183, "doc": "", "codigo": "class _Finalizada(_Estado):\n    etiqueta = EstadoMision.FINALIZADA\n\n    def verificar_concluida(self) -> None:\n        pass\n\n    def exito(self, resultado: Resultado | None) -> bool:\n        return resultado is not None and resultado.satisfactorio", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/mision.py"}, "_Pendiente": {"archivo": "dominio/mision.py", "simbolo": "_Pendiente", "linea": 140, "fin": 147, "doc": "", "codigo": "class _Pendiente(_Estado):\n    etiqueta = EstadoMision.PENDIENTE\n\n    def asignar(self) -> _Estado:\n        return _ASIGNADA\n\n    def cancelar(self) -> _Estado:\n        return _CANCELADA", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/mision.py"}, "_Pendiente.asignar": {"archivo": "dominio/mision.py", "simbolo": "_Pendiente.asignar", "linea": 143, "fin": 144, "doc": "", "codigo": "def asignar(self) -> _Estado:\n    return _ASIGNADA", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/mision.py"}, "_Pendiente.cancelar": {"archivo": "dominio/mision.py", "simbolo": "_Pendiente.cancelar", "linea": 146, "fin": 147, "doc": "", "codigo": "def cancelar(self) -> _Estado:\n    return _CANCELADA", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/mision.py"}, "Persona": {"archivo": "dominio/personal.py", "simbolo": "Persona", "linea": 12, "fin": 31, "doc": "Valor con identificaci\u00f3n: una o varias competencias, sin niveles ni vencimientos.", "codigo": "@dataclass(frozen=True, slots=True)\nclass Persona:\n    \"\"\"Valor con identificaci\u00f3n: una o varias competencias, sin niveles ni vencimientos.\"\"\"\n\n    id: str\n    nombre: str\n    competencias: frozenset[Competencia]\n\n    def __post_init__(self) -> None:\n        if not hay_texto(self.id) or not hay_texto(self.nombre):\n            raise RecursoInvalido(\"La persona necesita identificaci\u00f3n y nombre\")\n        # acepta cualquier colecci\u00f3n y la deja inmutable\n        object.__setattr__(self, \"competencias\", frozenset(self.competencias))\n        if not self.competencias:\n            raise RecursoInvalido(\"La persona necesita al menos una competencia\")\n        if not all(Competencia.contiene(c) for c in self.competencias):\n            raise RecursoInvalido(\"Competencia fuera de cat\u00e1logo\")\n\n    def tiene(self, competencia: Competencia) -> bool:\n        return competencia in self.competencias", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/personal.py"}, "Unidad": {"archivo": "dominio/unidad.py", "simbolo": "Unidad", "linea": 78, "fin": 274, "doc": "", "codigo": "class Unidad:\n    def __init__(\n        self,\n        unidad_id: str,\n        base_id: str,\n        jefe: Persona,\n        vehiculo: Vehiculo,\n        personal: tuple[Persona, ...] = (),\n        equipamiento: tuple[Equipo, ...] = (),\n    ) -> None:\n        if not hay_texto(unidad_id) or not hay_texto(base_id):\n            raise RecursoInvalido(\"La unidad necesita identificaci\u00f3n y base operativa\")\n        if jefe is None or vehiculo is None:\n            raise RecursoInvalido(\"La unidad necesita un jefe y un veh\u00edculo\")\n        dotacion = (jefe, *personal)\n        if len({p.id for p in dotacion}) != len(dotacion):\n            raise RecursoDuplicado(\"Una persona no puede figurar dos veces en la unidad\")\n        if len({e.id for e in equipamiento}) != len(equipamiento):\n            raise RecursoDuplicado(\"Un equipo no puede figurar dos veces en la unidad\")\n        self._id = unidad_id\n        self._base_id = base_id\n        self._jefe_id = jefe.id\n        self._personal: dict[str, Persona] = {p.id: p for p in dotacion}  # el jefe integra la dotaci\u00f3n\n        self._vehiculo = vehiculo\n        self._equipamiento: dict[str, Equipo] = {e.id: e for e in equipamiento}\n        self._condicion: _Condicion = _HABILITADA\n        self._mision_id: str | None = None\n        self._registros: list[Registro] = []\n\n    # \u2500\u2500 Lectura \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n    @property\n    def id(self) -> str:\n        return self._id\n\n    @property\n    def base_id(self) -> str:\n        return self._base_id\n\n    @property\n    def jefe(self) -> Persona:\n        return self._personal[self._jefe_id]\n\n    @property\n    def personal(self) -> tuple[Persona, ...]:\n        \"\"\"Toda la dotaci\u00f3n, jefe incluido (se cuenta una sola vez).\"\"\"\n        return tuple(self._personal.values())\n\n    @property\n    def vehiculo(self) -> Vehiculo:\n        return self._vehiculo\n\n    @property\n    def equipamiento(self) -> tuple[Equipo, ...]:\n        return tuple(self._equipamiento.values())\n\n    @property\n    def condicion(self) -> CondicionServicio:\n        return self._condicion.etiqueta\n\n    @property\n    def mision_comprometida_id(self) -> str | None:\n        \"\"\"Id de la misi\u00f3n que la reserva o la ejecuta; None si est\u00e1 libre.\"\"\"\n        return self._mision_id\n\n    @property\n    def registros(self) -> tuple[Registro, ...]:\n        return tuple(self._registros)\n\n    def tiene_persona(self, persona_id: str) -> bool:\n        return persona_id in self._personal\n\n    def usa_vehiculo(self, vehiculo_id: str) -> bool:\n        return self._vehiculo.id == vehiculo_id\n\n    def tiene_equipo(self, equipo_id: str) -> bool:\n        return equipo_id in self._equipamiento\n\n    def tiene_equipo_operativo(self, categoria) -> bool:\n        return any(e.categoria is categoria and e.operativo for e in self._equipamiento.values())\n\n    # \u2500\u2500 Compromiso con misiones (\u00a78.2, \u00a78.3) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n    def comprometer(self, mision: Mision) -> None:\n        \"\"\"Verifica TODAS las condiciones (\u00a78.2, en orden) y reci\u00e9n despu\u00e9s se reserva.\n\n        Si algo falla se lanza el motivo y la unidad queda exactamente como estaba.\n        \"\"\"\n        self._condicion.verificar_habilitada()\n        if self._mision_id is not None:\n            raise UnidadOcupada(f\"La unidad {self._id} ya tiene la misi\u00f3n {self._mision_id}\")\n        self._vehiculo.verificar_operativo()\n        mision.verificar_vehiculo(self._vehiculo)\n        mision.verificar_personal(self.personal)\n        mision.verificar_equipamiento(self)\n        self._mision_id = mision.id\n\n    def liberar(self, mision_id: str) -> None:\n        \"\"\"Recupera la disponibilidad (misi\u00f3n finalizada, cancelada, rechazada o reasignada).\"\"\"\n        if self._mision_id != mision_id:\n            raise UnidadComprometida(f\"La unidad {self._id} no est\u00e1 comprometida con la misi\u00f3n {mision_id}\")\n        self._mision_id = None\n\n    def exigir_jefe(self, persona_id: str) -> None:\n        if persona_id != self._jefe_id:\n            raise NoEsJefeDeLaUnidad(f\"El usuario no es el jefe de la unidad {self._id}\")\n\n    # \u2500\u2500 Administraci\u00f3n de recursos (\u00a72.4) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n    def incorporar_personal(self, persona: Persona, actor_id: str, fecha_hora: datetime) -> None:\n        self._exigir_modificable()\n        if persona.id in self._personal:\n            raise RecursoDuplicado(f\"{persona.id} ya integra la unidad\")\n        registro = Registro.de(actor_id, fecha_hora, Operacion.PERSONAL_INCORPORADO, self._id, persona.id)\n        self._personal[persona.id] = persona\n        self._registros.append(registro)\n\n    def retirar_personal(self, persona_id: str, actor_id: str, fecha_hora: datetime) -> None:\n        self._exigir_modificable()\n        if persona_id not in self._personal:\n            raise NoEncontrado(f\"{persona_id} no integra la unidad\")\n        if persona_id == self._jefe_id:\n            raise RecursoInvalido(\"El jefe no se retira: la unidad siempre necesita jefe\")\n        registro = Registro.de(actor_id, fecha_hora, Operacion.PERSONAL_RETIRADO, self._id, persona_id)\n        del self._personal[persona_id]\n        self._registros.append(registro)\n\n    def cambiar_vehiculo(self, vehiculo: Vehiculo, actor_id: str, fecha_hora: datetime) -> None:\n        self._exigir_modificable()\n        registro = Registro.de(actor_id, fecha_hora, Operacion.VEHICULO_CAMBIADO, self._id, vehiculo.id,\n                               vehiculo_anterior=self._vehiculo.id)\n        self._vehiculo = vehiculo\n        self._registros.append(registro)\n\n    def cambiar_condicion_vehiculo(self, condicion: CondicionOperativa, actor_id: str,\n                                   fecha_hora: datetime) -> None:\n        self._exigir_modificable()\n        nuevo = self._vehiculo.con_condicion(condicion)  # valida la condici\u00f3n antes de tocar\n        registro = Registro.de(actor_id, fecha_hora, Operacion.VEHICULO_CONDICION_CAMBIADA, self._id,\n                               nuevo.id, condicion=condicion.value)\n        self._vehiculo = nuevo\n        self._registros.append(registro)\n\n    def incorporar_equipo(self, equipo: Equipo, actor_id: str, fecha_hora: datetime) -> None:\n        self._exigir_modificable()\n        if equipo.id in self._equipamiento:\n            raise RecursoDuplicado(f\"{equipo.id} ya integra la unidad\")\n        registro = Registro.de(actor_id, fecha_hora, Operacion.EQUIPO_INCORPORADO, self._id, equipo.id)\n        self._equipamiento[equipo.id] = equipo\n        self._registros.append(registro)\n\n    def retirar_equipo(self, equipo_id: str, actor_id: str, fecha_hora: datetime) -> None:\n        self._exigir_modificable()\n        if equipo_id not in self._equipamiento:\n            raise NoEncontrado(f\"{equipo_id} no integra la unidad\")\n        registro = Registro.de(actor_id, fecha_hora, Operacion.EQUIPO_RETIRADO, self._id, equipo_id)\n        del self._equipamiento[equipo_id]\n        self._registros.append(registro)\n\n    def cambiar_condicion_equipo(self, equipo_id: str, condicion: CondicionOperativa, actor_id: str,\n                                 fecha_hora: datetime) -> None:\n        self._exigir_modificable()\n        if equipo_id not in self._equipamiento:\n            raise NoEncontrado(f\"{equipo_id} no integra la unidad\")\n        nuevo = self._equipamiento[equipo_id].con_condicion(condicion)\n        registro = Registro.de(actor_id, fecha_hora, Operacion.EQUIPO_CONDICION_CAMBIADA, self._id,\n                               equipo_id, condicion=condicion.value)\n        self._equipamiento[equipo_id] = nuevo\n        self._registros.append(registro)\n\n    def declarar_en_mantenimiento(self, actor_id: str, fecha_hora: datetime) -> None:\n        self._cambiar_condicion(_EN_MANTENIMIENTO, actor_id, fecha_hora)\n\n    def declarar_fuera_de_servicio(self, actor_id: str, fecha_hora: datetime) -> None:\n        self._cambiar_condicion(_FUERA_DE_SERVICIO, actor_id, fecha_hora)\n\n    def restablecer_servicio(self, actor_id: str, fecha_hora: datetime) -> None:\n        self._cambiar_condicion(_HABILITADA, actor_id, fecha_hora)\n\n    def registrar_alta(self, actor_id: str, fecha_hora: datetime) -> None:\n        \"\"\"La flota la llama al incorporar la unidad: deja el primer registro de su historial.\"\"\"\n        self._registros.append(Registro.de(actor_id, fecha_hora, Operacion.UNIDAD_REGISTRADA, self._id,\n                                           base=self._base_id))\n\n    # \u2500\u2500 Internos \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n    def _cambiar_condicion(self, nueva: _Condicion, actor_id: str, fecha_hora: datetime) -> None:\n        self._exigir_modificable()\n        registro = Registro.de(actor_id, fecha_hora, Operacion.UNIDAD_CONDICION_CAMBIADA, self._id,\n                               anterior=self._condicion.etiqueta.value, nueva=nueva.etiqueta.value)\n        self._condicion = nueva\n        self._registros.append(registro)\n\n    def _exigir_modificable(self) -> None:\n        if self._mision_id is not None:\n            raise UnidadComprometida(\n                f\"La unidad {self._id} est\u00e1 comprometida con la misi\u00f3n {self._mision_id}: no se modifica\")", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/unidad.py"}, "Ambulancia": {"archivo": "dominio/vehiculos.py", "simbolo": "Ambulancia", "linea": 87, "fin": 94, "doc": "", "codigo": "@dataclass(frozen=True, kw_only=True)\nclass Ambulancia(Vehiculo):\n    @property\n    def categoria(self) -> CategoriaVehiculo:\n        return CategoriaVehiculo.AMBULANCIA\n\n    def verificar_asistencia(self) -> None:\n        pass", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/vehiculos.py"}, "TransportePersonas": {"archivo": "dominio/vehiculos.py", "simbolo": "TransportePersonas", "linea": 56, "fin": 74, "doc": "Capacidad en personas evacuadas, sin contar a la dotaci\u00f3n (\u00a75.4).", "codigo": "@dataclass(frozen=True, kw_only=True)\nclass TransportePersonas(Vehiculo):\n    \"\"\"Capacidad en personas evacuadas, sin contar a la dotaci\u00f3n (\u00a75.4).\"\"\"\n\n    capacidad_evacuados: int\n\n    def __post_init__(self) -> None:\n        super().__post_init__()\n        if not es_entero_positivo(self.capacidad_evacuados):\n            raise RecursoInvalido(\"La capacidad de evacuados debe ser un entero positivo\")\n\n    @property\n    def categoria(self) -> CategoriaVehiculo:\n        return CategoriaVehiculo.TRANSPORTE_DE_PERSONAS\n\n    def verificar_evacuacion(self, cantidad: int) -> None:\n        if cantidad > self.capacidad_evacuados:\n            raise VehiculoIncompatible(\n                f\"Capacidad insuficiente: se necesitan {cantidad} plazas y hay {self.capacidad_evacuados}\")", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/vehiculos.py"}, "Vehiculo": {"archivo": "dominio/vehiculos.py", "simbolo": "Vehiculo", "linea": 18, "fin": 53, "doc": "", "codigo": "@dataclass(frozen=True, kw_only=True)\nclass Vehiculo(ABC):\n    id: str\n    condicion: CondicionOperativa = CondicionOperativa.OPERATIVO\n\n    def __post_init__(self) -> None:\n        if not hay_texto(self.id):\n            raise RecursoInvalido(\"El veh\u00edculo necesita identificaci\u00f3n\")\n        if not CondicionOperativa.contiene(self.condicion):\n            raise RecursoInvalido(\"Condici\u00f3n de veh\u00edculo fuera de cat\u00e1logo\")\n\n    @property\n    @abstractmethod\n    def categoria(self) -> CategoriaVehiculo: ...\n\n    @property\n    def operativo(self) -> bool:\n        return self.condicion is CondicionOperativa.OPERATIVO\n\n    def con_condicion(self, condicion: CondicionOperativa) -> Vehiculo:\n        return replace(self, condicion=condicion)\n\n    def verificar_operativo(self) -> None:\n        if not self.operativo:\n            raise VehiculoIncompatible(f\"El veh\u00edculo {self.id} est\u00e1 fuera de servicio\")\n\n    # Por defecto un veh\u00edculo NO sirve para nada: cada categor\u00eda habilita lo suyo.\n\n    def verificar_evacuacion(self, cantidad: int) -> None:\n        raise VehiculoIncompatible(f\"Un veh\u00edculo de {self.categoria.value} no sirve para evacuar\")\n\n    def verificar_rescate(self) -> None:\n        raise VehiculoIncompatible(f\"Un veh\u00edculo de {self.categoria.value} no sirve para rescatar\")\n\n    def verificar_asistencia(self) -> None:\n        raise VehiculoIncompatible(f\"Un veh\u00edculo de {self.categoria.value} no sirve para asistencia sanitaria\")", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/vehiculos.py"}, "VehiculoRescate": {"archivo": "dominio/vehiculos.py", "simbolo": "VehiculoRescate", "linea": 77, "fin": 84, "doc": "", "codigo": "@dataclass(frozen=True, kw_only=True)\nclass VehiculoRescate(Vehiculo):\n    @property\n    def categoria(self) -> CategoriaVehiculo:\n        return CategoriaVehiculo.VEHICULO_DE_RESCATE\n\n    def verificar_rescate(self) -> None:\n        pass", "abs": "/Users/fran/ProyectoFinal-PP5/dominio/vehiculos.py"}};
const der=document.getElementById('der');

function resaltar(c){
 const re=/(#.*$)|(f?"[^"\n]*"|f?'[^'\n]*')|(^\s*@[\w.]+)|\b(class|def|return|raise|if|else|elif|for|in|not|and|or|is|None|True|False|from|import|self|with|lambda)\b/gm;
 let o='',u=0,m;while((m=re.exec(c))){o+=esc(c.slice(u,m.index));
  const cl=m[1]?'c':m[2]?'s':m[3]?'d':'k';o+='<span class='+cl+'>'+esc(m[0])+'</span>';u=re.lastIndex}
 return o+esc(c.slice(u))}

 '<a class=vs href="vscode://file/'+d.abs+':'+d.linea+'">Abrir en VS Code</a>'+
 (d.doc?'<div class=doc>'+esc(d.doc)+'</div>':'')+'<pre>'+resaltar(d.codigo)+'</pre>'}
